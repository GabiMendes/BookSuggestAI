<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BookSuggest AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="min-vh-100 bg-gradient-primary d-flex align-items-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-xl-6 col-lg-8 col-md-9">
                    <div class="card o-hidden border-0 shadow-lg my-5">
                        <div class="card-body p-5">
                            <div class="text-center">
                                <i class="fas fa-book-reader fa-4x text-primary mb-4"></i>
                                <h1 class="h4 text-gray-900 mb-4">BookSuggest AI</h1>
                                <p class="text-muted mb-4">Faça login para acessar suas recomendações personalizadas</p>
                                
                                <a href="/auth/google" class="btn btn-google btn-user btn-block">
                                    <i class="fab fa-google fa-fw me-2"></i>Entrar com Google
                                </a>
                                
                                <hr class="my-4">
                                
                                <div class="text-center">
                                    <a class="small" href="/">Voltar ao Início</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
